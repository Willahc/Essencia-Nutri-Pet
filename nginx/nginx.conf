# ==============================================================
# Essência Nutri Pet - Nginx Reverse Proxy Configuration
# Suporte a upload de PDFs até 30MB, compressão Gzip e SSL
# ==============================================================

upstream nextjs_upstream {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost _;

    # Tamanho máximo de upload (permite exames e laudos pesados)
    client_max_body_size 30M;

    # Compressão Gzip para performance mobile
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Certbot challenge path (para renovação automática de SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy para Next.js Standalone
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Cache de arquivos estáticos Next.js
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Arquivos públicos e exames
    location /exams/ {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=86400";
    }
}
