services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: essencia-nutripet-app
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    volumes:
      - prisma_data:/app/prisma
      - exams_data:/app/public/exams
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - essencia-net

  nginx:
    image: nginx:alpine
    container_name: essencia-nutripet-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - essencia-net

volumes:
  prisma_data:
  exams_data:
  certbot_etc:
  certbot_var:
  certbot_www:

networks:
  essencia-net:
    driver: bridge
